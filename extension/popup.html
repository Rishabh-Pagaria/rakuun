<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Rakuun</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div id="signin-screen" class="signin-screen">
      <img src="icons/logo.png" alt="" class="signin-mark">
      <h1 class="signin-title">Rakuun</h1>
      <p class="signin-tagline">Outreach, personalized</p>

      <p class="signin-description">
        Select text on any page and turn it into a tailored outreach email.
      </p>

      <button id="signin-btn" class="signin-button">
        <svg class="google-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Sign in with Google
      </button>

      <p class="signin-footnote">Gmail access is requested later, on your first send.</p>

      <div class="output-section">
        <div id="output" class="output"></div>
      </div>
    </div>

    <div id="main-screen" class="main-screen">
      <div class="topbar">
        <div class="brand">
          <img src="icons/logo.png" alt="" class="brand-mark">
          <span class="brand-name">Rakuun</span>
        </div>
        <div class="user">
          <img id="user-avatar" class="user-avatar" src="icons/logo.png" alt="">
          <span id="user-name" class="user-name"></span>
          <button id="signout-btn" class="icon-btn" title="Sign out" aria-label="Sign out">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <polyline points="16,17 21,12 16,7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <main class="main">
        <div class="field">
          <label for="context" class="label">Purpose</label>
          <select id="context" class="select">
            <option value="">Select email purpose...</option>
            <option value="job_application">Job Application / Career Inquiry</option>
            <option value="research_collaboration">Research Collaboration</option>
            <option value="ta_application">Teaching Assistant Application</option>
            <option value="internship_inquiry">Internship Inquiry</option>
            <option value="networking">Professional Networking</option>
            <option value="phd_inquiry">PhD Application Inquiry</option>
            <option value="conference_meeting">Conference Meeting Request</option>
            <option value="guest_lecture">Guest Lecture Invitation</option>
          </select>
        </div>

        <div class="field">
          <label for="body" class="label">Content</label>
          <textarea
            id="body"
            rows="6"
            placeholder="Selected text will appear here..."
            class="textarea"
          ></textarea>
        </div>

        <div class="field">
          <label for="to" class="label">To</label>
          <input type="email" id="to" class="input" placeholder="Recipient email will appear here...">
        </div>

        <div class="field">
          <label for="subject" class="label">Subject</label>
          <input type="text" id="subject" class="input" placeholder="Subject will be generated...">
        </div>

        <div class="actions">
          <button id="generateBtn" class="btn btn-primary">
            <span class="btn-text">Generate</span>
            <div class="spinner" id="spinner"></div>
          </button>
          <button id="sendBtn" class="btn btn-secondary" disabled>
            <span class="btn-text">Send</span>
            <div class="spinner" id="sendSpinner"></div>
          </button>
        </div>

        <div class="output-section">
          <div id="main-output" class="output"></div>
        </div>
      </main>
    </div>

    <!-- config.js is generated by `npm run build:extension` and must load first. -->
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="gmail-auth.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
